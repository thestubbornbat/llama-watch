[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-watch"
version = "0.1.0"
description = "Live request, cache, and GPU observability proxy for llama.cpp"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "llama-watch contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
llama-watch = "llamawatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
